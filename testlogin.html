<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zenux OAuth + SSO Test</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(circle at top, rgba(15,124,255,0.14), transparent 35%), #f5f8fc;
      font-family: "Segoe UI", system-ui, sans-serif; color: #102033; }
    .card { width: min(92vw, 460px); padding: 28px; border-radius: 24px;
      background: rgba(255,255,255,0.94); border: 1px solid rgba(148,163,184,0.24);
      box-shadow: 0 24px 54px rgba(15,23,42,0.14); }
    h1 { margin: 0 0 6px; font-size: 28px; }
    p { margin: 0 0 18px; line-height: 1.7; color: #607286; }
    button { border: 0; border-radius: 14px; padding: 13px 18px;
      font: 600 15px/1 "Segoe UI", system-ui, sans-serif; cursor: pointer; }
    .btn-primary { background: #0f7cff; color: #fff; }
    .btn-secondary { background: #e8edf3; color: #102033; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    pre { margin: 14px 0 0; padding: 14px; border-radius: 16px; background: #edf4fb;
      white-space: pre-wrap; word-break: break-word; font: 13px/1.6 Consolas, monospace;
      color: #102033; min-height: 40px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600; margin-bottom: 10px; }
    .badge.active { background: #dcfce7; color: #166534; }
    .badge.inactive { background: #fee2e2; color: #991b1b; }
    .badge.waiting { background: #fef9c3; color: #854d0e; }
  </style>
</head>
<body>
  <main class="card">
    <h1>OAuth + SSO Test</h1>
    <p>
      SSO floating bar auto-appears at <strong>top-right</strong> if you're logged into Zenuxs
      but not this site. After login, try the YouTube API below.
    </p>

    <div id="ssoBadge" class="badge waiting">SSO checking...</div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button id="login" class="btn-primary">Continue with Zenuxs</button>
      <button id="getYoutube" class="btn-secondary">📺 Get YouTube Data</button>
      <button id="exportLogs" class="btn-secondary" style="font-size:13px;">📥 Export Logs</button>
    </div>

    <pre id="log">Initializing SDK...</pre>
    <pre id="youtubeData" style="margin-top:8px;">YouTube data will appear here after login.</pre>
  </main>

  <script src="./src/zenux-oauth.js"></script>
  <script>
    const log = document.getElementById('log');
    const ssoBadge = document.getElementById('ssoBadge');
    const youtubeData = document.getElementById('youtubeData');
    const write = (value) => { log.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2); };

    // ── CONFIG ──────────────────────────────────────────────
    // For production (live Zenuxs auth server):
    const IS_LOCAL = false; // set to true for local dev
    const config = {
      clientId: 'd5695548c45c3ae5',
      scopes: "openid profile email youtube",
      debug: true,
    };
    if (IS_LOCAL) {
      config.authServer = 'http://localhost:5173';
      config.webUrl = 'http://localhost:5173';
    }
    const oauth = new ZenuxOAuth(config);

    // Listen for SSO bar being shown (via custom event bridge)
    oauth.on('ssoDetected', (user) => write('SSO: Logged in as ' + (user.email || user.name)));
    oauth.on('ssoNone', () => { ssoBadge.className = 'badge inactive'; ssoBadge.textContent = 'Not logged into Zenuxs'; });
    oauth.on('login', (tokens) => write({ event: 'login', tokens }));
    oauth.on('error', (error) => write({ event: 'error', code: error.code, message: error.message }));

    window.addEventListener('load', async () => {
      try {
        const result = await oauth.init();

        // Check if SSO bar was shown after a short delay
        const ssoCheckTimer = setTimeout(() => {
          const bar = document.getElementById('zenuxs-sso-bar');
          if (bar) {
            ssoBadge.className = 'badge active';
            ssoBadge.textContent = '✓ SSO bar visible at top-right';
            write('SSO floating bar rendered. Click "Continue" to log in, or dismiss with ✕.');
          } else {
            ssoBadge.className = 'badge inactive';
            ssoBadge.textContent = 'No SSO session detected';
          }
        }, 3000);

        // Also listen for SSO events from the SDK
        oauth.on('ssoDetected', (user) => {
          clearTimeout(ssoCheckTimer);
          ssoBadge.className = 'badge active';
          ssoBadge.textContent = '✓ SSO: logged in as ' + (user.email || user.name);
          write('SSO session found for ' + (user.email || user.name) + '. Bar rendered at top-right.');
        });
        oauth.on('ssoNone', () => {
          ssoBadge.className = 'badge inactive';
          ssoBadge.textContent = 'No SSO session — not logged into Zenuxs';
          write('No Zenuxs session detected.\n' +
                '• Make sure you are logged into auth.zenuxs.in in this browser\n' +
                '• Check the browser console (F12) for [ZenuxOAuth:SSO] debug logs\n' +
                '• If testing locally, set IS_LOCAL = true and run the account frontend on :5173');
        });

        if (result && result.access_token) {
          write({ event: 'callback-complete', tokens: result });
          return;
        }
        if (oauth.getTokens()) {
          write({ event: 'session-found', tokens: oauth.getTokens() });
          return;
        }
        write('Ready. Click "Continue with Zenuxs" to log in.');
      } catch (err) {
        write('Init error: ' + err.message);
      }
    });

    document.getElementById('login').addEventListener('click', async () => {
      await oauth.login({ mode: 'popup' });
    });

    document.getElementById('getYoutube').addEventListener('click', async () => {
      try {
        const tokens = oauth.getTokens();
        if (!tokens) { youtubeData.textContent = 'Please login first.'; return; }
        youtubeData.textContent = 'Loading profile...';
        const youtube = oauth.youtube();
        const profile = await youtube.getProfile();
        const channels = await youtube.getChannels();
        let channelId = channels?.[0]?.id || channels?.[0]?.channelId || channels?.[0]?.youtubeChannelId || channels?.[0]?.channel_id || null;
        let videos = channelId ? await youtube.getVideos(channelId) : null;
        youtubeData.textContent = JSON.stringify({ profile, channels, channelId, videos }, null, 2);
      } catch (err) {
        youtubeData.textContent = JSON.stringify({ error: true, message: err.message }, null, 2);
      }
    });

    document.getElementById('exportLogs')?.addEventListener('click', () => {
      if (typeof oauth.exportDebugLogs === 'function') oauth.exportDebugLogs();
      else if (oauth._debugLogs) console.table(oauth._debugLogs);
      else console.log('No debug logs');
    });
  </script>
</body>
</html>
