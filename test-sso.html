<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zenuxs SSO Floating Bar Test</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #f5f8fc; font-family: "Segoe UI", system-ui, sans-serif; color: #102033;
    }
    .card { width: min(92vw, 460px); padding: 28px; border-radius: 24px;
      background: rgba(255,255,255,0.94); border: 1px solid rgba(148,163,184,0.24);
      box-shadow: 0 24px 54px rgba(15,23,42,0.14); text-align: center; }
    h1 { margin: 0 0 10px; font-size: 30px; }
    p { margin: 0 0 18px; line-height: 1.7; color: #607286; }
    button { border: 0; border-radius: 14px; padding: 13px 18px;
      font: 600 15px/1 "Segoe UI", system-ui, sans-serif; background: #0f7cff;
      color: #fff; cursor: pointer; margin: 0 4px; }
    .status { margin-top: 16px; padding: 12px; border-radius: 12px;
      background: #edf4fb; font: 13px/1.6 monospace; text-align: left;
      white-space: pre-wrap; word-break: break-word; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 600; margin-bottom: 12px; }
    .badge.on { background: #dcfce7; color: #166534; }
    .badge.off { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <main class="card">
    <h1>SSO Floating Bar Test</h1>
    <p>If you're logged into Zenuxs (auth.zenuxs.in), a floating "Continue as" bar should appear at the top-right of this page.</p>

    <div id="badge" class="badge off">SDK not initialized</div>
    <div>
      <button onclick="ssoTest()">Run SSO Test</button>
      <button onclick="location.reload()">Reload Page</button>
    </div>
    <div class="status" id="log">Waiting for SDK init...</div>
  </main>

  <script src="./src/zenux-oauth.js"></script>
  <script>
    // Configuration — update these for your setup
    const SSO_CONFIG = {
      clientId: 'd5695548c45c3ae5',
      scopes: 'openid profile email',
      // For local testing, set authServer to your local instance
      // authServer: 'http://localhost:5173',
      // ssoEnabled: true,
      debug: true,
    };

    const log = document.getElementById('log');
    const badge = document.getElementById('badge');
    let oauth;

    async function ssoTest() {
      try {
        badge.className = 'badge on';
        badge.textContent = 'SDK initialized — SSO bar should appear if logged in';
        log.textContent = 'ZenuxOAuth instance created. SSO check running via iframe...\n' +
          'Check the top-right corner of this page.\n\n' +
          'If no bar appears:\n' +
          '1. Open https://auth.zenuxs.in and log in\n' +
          '2. Reload this page\n' +
          '3. Or check the console for debug logs';
      } catch (err) {
        log.textContent = 'Error: ' + err.message;
      }
    }

    // Auto-initialize on load
    window.addEventListener('load', () => {
      try {
        oauth = new ZenuxOAuth(SSO_CONFIG);
        oauth.on('error', (err) => {
          log.textContent = 'Event: error — ' + err.message;
        });
        oauth.init().then(result => {
          log.textContent = 'SDK initialized ✓\n' +
            'Authenticated: ' + (result?.isAuthenticated ? 'Yes' : 'No') + '\n' +
            'SSO iframe created — floating bar should appear at top-right if you have a Zenuxs session.\n\n' +
            'Dismiss the bar with the ✕ button. Refresh to see it again.';
          badge.className = 'badge on';
          badge.textContent = 'SDK ready — SSO active';
        }).catch(err => {
          log.textContent = 'Init error: ' + err.message;
        });
      } catch (err) {
        log.textContent = 'Constructor error: ' + err.message;
      }
    });
  </script>
</body>
</html>
